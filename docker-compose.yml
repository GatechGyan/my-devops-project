version: '3.8'

services:
  # 🌐 फ्रंटएंड सर्विस कॉन्फ़िगरेशन
  my-frontend:
    build: ./frontend       # यह टेराफॉर्म की तरह फ्रंटएंड फोल्डर की Dockerfile को ढूंढेगा
    container_name: react_frontend
    ports:
      - "9999:80"           # पोर्ट मैपिंग: आपके लैपटॉप का 8080 पोर्ट कंटेनर के 80 पोर्ट से जुड़ेगा

  # 📡 बैकएंड सर्विस कॉन्फ़िगरेशन
  my-backend:
    build: ./backend        # यह बैकएंड फोल्डर की Dockerfile से इमेज बनाएगा
    container_name: node_backend
    ports:
      - "5001:5000"         # पोर्ट मैपिंग: आपके लैपटॉप का 5000 पोर्ट कंटेनर के 5000 पोर्ट से जुड़ेगा
    environment:
      - PORT=5000           # कंटेनर के अंदर एनवायरनमेंट वेरिएबल पास करना
