apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
spec:
  selector:
    app: react-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30008       # आपके लैपटॉप का यह पोर्ट फ्रंटएंड से जुड़ेगा
  type: NodePort            # यह क्लस्टर के बाहर ट्रैफिक एक्सेस करने के लिए है
